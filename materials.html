    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      (function () {
        var body = document.body;
        var tx = window.innerWidth * 0.5;
        var ty = window.innerHeight * 0.5;
        var x = tx;
        var y = ty;
        var ticking = false;

        function paint() {
          x += (tx - x) * 0.5;
          y += (ty - y) * 0.5;
          body.style.setProperty("--gx", x + "px");
          body.style.setProperty("--gy", y + "px");
          body.style.setProperty("--lx", x + "px");
          body.style.setProperty("--ly", y + "px");

          if (Math.abs(tx - x) > 0.2 || Math.abs(ty - y) > 0.2) {
            requestAnimationFrame(paint);
          } else {
            ticking = false;
          }
        }

        function onPointer(e) {
          tx = e.clientX;
          ty = e.clientY;
          body.classList.add("liquid-global-active");
          if (!ticking) {
            ticking = true;
            requestAnimationFrame(paint);
          }
        }

        window.addEventListener("pointermove", onPointer, { passive: true });

        window.addEventListener("pointerleave", function () {
          body.classList.remove("liquid-global-active");
        });
      })();

      window.setTimeout(function () {
        var doc = document.documentElement;
        var loader = document.getElementById("home-loading");
        if (!doc.classList.contains("subpage-is-booting")) return;
        if (window.__hillBackgroundActive) return;
        doc.classList.remove("subpage-is-booting");
        if (loader) {
          loader.classList.add("is-done");
          window.setTimeout(function () { loader.remove(); }, 850);
        }
      }, 3600);
    </script>
