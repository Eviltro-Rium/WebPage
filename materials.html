    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("home-scene-loading");
        var sceneFinished = false;
        var fallbackTimer;
        function finishScene(ready) {
          if (sceneFinished) return;
          sceneFinished = true;
          window.clearTimeout(fallbackTimer);
          root.classList.remove("home-scene-loading");
          root.classList.add("home-scene-finishing");
          if (ready) root.classList.add("home-scene-ready");
          var status = document.getElementById("home-scene-status");
          if (status) status.setAttribute("aria-hidden", "true");
          window.setTimeout(function () {
            root.classList.remove("home-scene-finishing");
            if (status) status.remove();
          }, 650);
        }
        document.addEventListener("rium-scene-ready", function () {
          // 即使超时后背景才就绪，也要允许完成首帧的画布淡入。
          root.classList.add("home-scene-ready");
          finishScene(true);
        }, { once: true });
        fallbackTimer = window.setTimeout(function () { finishScene(false); }, 8000);
        var theme = "light";
        try {
          theme = window.localStorage.getItem("rium-theme") === "dark" ? "dark" : "light";
        } catch (e) { /* ignore storage failures */ }
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
      })();
    </script>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      (function () {
        var body = document.body;
        var tx = window.innerWidth * 0.5;
        var ty = window.innerHeight * 0.5;
        var x = tx;
        var y = ty;
        var ticking = false;

        function paint() {
          x += (tx - x) * 0.5;
          y += (ty - y) * 0.5;
          body.style.setProperty("--gx", x + "px");
          body.style.setProperty("--gy", y + "px");
          body.style.setProperty("--lx", x + "px");
          body.style.setProperty("--ly", y + "px");

          if (Math.abs(tx - x) > 0.2 || Math.abs(ty - y) > 0.2) {
            requestAnimationFrame(paint);
          } else {
            ticking = false;
          }
        }

        function onPointer(e) {
          tx = e.clientX;
          ty = e.clientY;
          body.classList.add("liquid-global-active");
          if (!ticking) {
            ticking = true;
            requestAnimationFrame(paint);
          }
        }

        window.addEventListener("pointermove", onPointer, { passive: true });

        window.addEventListener("pointerleave", function () {
          body.classList.remove("liquid-global-active");
        });
      })();

      window.setTimeout(function () {
        var doc = document.documentElement;
        var loader = document.getElementById("home-loading");
        if (!doc.classList.contains("subpage-is-booting")) return;
        if (window.__hillBackgroundActive) return;
        doc.classList.remove("subpage-is-booting");
        if (loader) {
          loader.classList.add("is-done");
          window.setTimeout(function () { loader.remove(); }, 850);
        }
      }, 3600);
    </script>
