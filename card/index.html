<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rium 的个人名片">
  <meta name="theme-color" content="#0a1737">
  <title>Rium · 个人名片</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at 50% 15%, #234b8a, #0a1737 70%);
      color: #12254c;
      font: 1rem/1.5 system-ui, sans-serif;
    }
    main {
      width: min(100%, 360px);
      overflow: hidden;
      background: #f3f8ff;
      border: 1px solid #8cbbff;
      border-radius: 22px;
      box-shadow: 0 18px 50px #040c24a0;
    }
    picture { display: block; background: #d6ebfb; }
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    .profile {
      padding: 23px 24px 26px;
      border-top: 4px solid #3678e6;
    }
    h1 { margin: 0; font-size: 2.25rem; line-height: 1.15; }
    p { margin: 7px 0 22px; color: #35517b; }
    a {
      display: block;
      padding: 12px 16px;
      border-radius: 11px;
      background: #164ab2;
      color: white;
      text-decoration: none;
      text-align: center;
      font-weight: 650;
    }
    a:hover { background: #103a90; }
    a:focus-visible { outline: 3px solid #1a59cf; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <picture>
      <source media="(prefers-reduced-motion: reduce)" srcset="./xiao-lamian.png">
      <img src="./xiao-lamian.gif" width="184" height="112" alt="戴黄色护目镜的蓝色熊猫小拉面">
    </picture>
    <div class="profile">
      <h1>Rium</h1>
      <p>一只异色大熊猫</p>
      <a href="https://riumfurry.com/">前往个人网站</a>
    </div>
  </main>
</body>
</html>
