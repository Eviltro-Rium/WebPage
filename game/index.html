<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Furry Trial 是一款可直接在浏览器游玩的单机回合制卡牌游戏。">
    <title>Furry Trial · Rium</title>
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <a class="game-home-link" href="../index.html" aria-label="返回 Rium 主页">← 返回主页</a>

    <span class="game-status-badge">测试更新中</span>
    <div id="game-container">
        <div id="select-screen" class="active"></div>
        <div id="rules-screen"></div>
        <div id="char-detail-screen"></div>
        <div id="game-screen"></div>
    </div>
    <script>
        // The external-home link belongs to the game landing screen only.
        // Keep it in sync with the internal screen router so it disappears
        // from rules, character details and active battles.
        (function () {
            var link = document.querySelector('.game-home-link');
            var container = document.getElementById('game-container');
            var select = document.getElementById('select-screen');
            if (!link || !container || !select) return;
            function sync() {
                link.hidden = !select.classList.contains('active');
            }
            sync();
            if (typeof MutationObserver === 'function') {
                new MutationObserver(sync).observe(container, {
                    subtree: true,
                    attributes: true,
                    attributeFilter: ['class']
                });
            }
        })();
    </script>
