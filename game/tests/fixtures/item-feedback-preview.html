<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<base href="../../adventure/"><title>道具使用与卡牌移动预览</title>
<link rel="stylesheet" href="../css/game.css?v=20261026-item-feedback">
<style>
body{display:block;overflow:auto;background:#10251f;color:#eee;padding:24px;font-family:system-ui}#game-screen{display:flex;flex-direction:column;max-width:1000px;margin:28px auto;gap:10px}.preview-tools{display:flex;flex-wrap:wrap;gap:8px;max-width:1000px;margin:auto}.preview-tools button{padding:8px 12px;color:#e9d5ff;background:#241933;border:1px solid #72548f;border-radius:8px}.preview-piles{display:flex;gap:14px;justify-content:space-between}.preview-piles>div{padding:12px;border:1px solid #65847d;border-radius:10px;min-width:90px}.player-hand-zone{min-height:150px}#controls{display:flex;justify-content:center}#preview-status{max-width:1000px;margin:16px auto;color:#c6ddd4}#reveal-desc{min-height:24px;text-align:center}.hand-row{display:flex;gap:8px;justify-content:center}.ai-hand-row{display:flex;gap:8px;min-height:88px}
</style></head><body>
<div class="preview-tools"><button id="reset">重置道具</button><button id="discard">弃牌符：弃一抽二</button><button id="mulligan">卡牌大师：全部重抽</button><button id="borrow">变色龙颜料：借牌</button><button id="chaos">混沌球：弃三张牌</button><button id="recycle">垃圾回收：收回牌</button></div>
<p id="preview-status" role="status">使用成功后先消耗图标，再播放卡牌移动；下方是合并后的道具与货币面板。</p>
<main id="game-screen"><div class="preview-piles"><div id="deck-area">玩家牌库</div><div id="npc-deck-info">怪物共享牌库：24</div><div id="discard-top">弃牌库</div></div>
<div class="ai-hand-row" id="ai-hand"></div><div id="reveal-desc"></div>
<div id="adventure-info-bar" class="adventure-info-bar"></div>
<div class="player-hand-zone"><div class="zone-title">你的手牌</div><div id="player-hand" class="hand-row"></div></div>
<div id="adventure-item-bar" class="adventure-item-bar"></div><div id="controls">道具与配饰</div></main>
<script src="../js/ui/card_style.js"></script><script src="../js/ui/ui_core.js"></script><script src="../js/ui/render/runtime.js"></script>
<script src="js/content/registry.js"></script><script src="js/items/item_defs.js"></script><script src="js/content/currency.js"></script>
<script src="../js/ui/render/hand_render.js"></script><script src="../js/ui/renderer.js?v=20261026-item-feedback"></script><script src="../js/ui/events.js?v=20261026-item-feedback"></script><script src="../js/ui/render/adventure_bar.js?v=20261026-item-feedback"></script>
<script>
const preview=Object.create(GameUI.prototype); preview.anim=new AnimLayer();preview.gameScreen=document.getElementById('game-screen');
preview._hideTooltip=()=>{};preview._renderDiscardTop=()=>{};preview._updateUseItemButton=()=>{};
let serial=0,busy=false;
const card=(value,color='BLUE')=>({uid:'preview-'+serial++,color,value,isNumberCard:true});
const detail=name=>AdventureRegistry.getItem(name);
function paint(owner,hide=0){const row=document.getElementById(owner+'-hand');row.replaceChildren();const cards=preview.state[owner==='player'?'playerHand':'aiHand'];cards.slice(0,Math.max(0,cards.length-hide)).forEach((c,i)=>{const cv=renderCard(c,owner==='player'?70:52,owner==='player'?100:74,false,{isNpc:owner!=='player'});cv.dataset.cardId=cardId(c);cv.dataset.index=i;row.appendChild(cv);});}
preview._renderPlayerHand=opts=>paint('player',opts&&opts.hideTrailing||0);preview._renderAIHand=opts=>paint('ai',opts&&opts.hideTrailing||0);
function reset(){if(busy)return;preview.state={isAdventure:true,phase:'PLAYER_PLAY',aiDeckCount:24,aiDiscardCount:0,player:{},playerHand:[card(0,'GREEN'),card(2,'RED'),card(0),card(2)],aiHand:[card(1),card(4)],adventureGold:11,adventureBeastTokens:{cao:1},adventureConsumables:['CardTalisman','CardMaster','ChameleonPaint','ChaosOrb','GarbageRecycle'].map(detail).filter(Boolean),adventureAccessories:['Magnet'].map(detail).filter(Boolean)};paint('player');paint('ai');preview._renderAdventureItemBar(preview.state);preview._updateAdventureInfo(preview.state);}
async function run(kind){if(busy)return;busy=true;const names={discard:'CardTalisman',mulligan:'CardMaster',borrow:'ChameleonPaint',chaos:'ChaosOrb',recycle:'GarbageRecycle'};const index=preview.state.adventureConsumables.findIndex(it=>it.name===names[kind]);if(index<0){busy=false;return;}const events=[];let id=0;
if(kind==='discard'||kind==='mulligan'){const cards=preview.state.playerHand.splice(0,kind==='discard'?1:preview.state.playerHand.length);events.push({id:++id,type:'discardMany',from:'hand',who:'player',cards});const n=kind==='discard'?2:cards.length;for(let i=0;i<n;i++)preview.state.playerHand.push(card(i+1));events.push({id:++id,type:'draw',who:'player',count:n});}
if(kind==='borrow'){const borrowed=preview.state.aiHand.shift();preview.state.playerHand.push(borrowed);events.push({id:++id,type:'cardTransfer',who:'player',from:'ai',card:borrowed});}
if(kind==='chaos')events.push({id:++id,type:'discardMany',who:'ai',from:'npcDeck',faceUp:true,cards:[card(1),card(2),card(3)]});
if(kind==='recycle'){const returned=card(2,'GREEN');preview.state.playerHand.push(returned);events.push({id:++id,type:'cardTransfer',who:'player',from:'discard',card:returned});}
events.push({id:++id,type:'itemConsumed',itemIndex:index,itemName:names[kind],effectAfterId:0});preview.state.adventureConsumables.splice(index,1);preview._isConsumingEvents=true;try{preview._prepareHandAnimation(events);await preview._playEvents(events);}finally{preview._isConsumingEvents=false;preview._drawAnimationRemaining=null;paint('player');paint('ai');preview._renderAdventureItemBar(preview.state);busy=false;}document.getElementById('preview-status').textContent='已完成：'+document.getElementById(kind).textContent;}
document.getElementById('reset').onclick=reset;for(const kind of ['discard','mulligan','borrow','chaos','recycle'])document.getElementById(kind).onclick=()=>run(kind);
reset();
</script></body></html>
