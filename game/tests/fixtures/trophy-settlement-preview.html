<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>战利品结算预览</title>
  <link rel="stylesheet" href="../../css/game.css">
  <link rel="stylesheet" href="../../adventure/css/adventure.css">
  <style>
    #game-screen { display: block; min-height: 100vh; padding: 30px 16px; }
    #preview-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-bottom: 24px; }
    #preview-controls button { padding: 10px 18px; cursor: pointer; }
    #reveal-cards { display: flex; justify-content: center; margin: 50px auto; }
    #player-hand { display: flex; justify-content: center; gap: 8px; margin-top: 40px; }
    .trophy-settle-overlay { pointer-events: none; }
    .trophy-settle-sheet { pointer-events: auto; }
  </style>
</head>
<body>
  <div id="game-screen">
    <div id="preview-controls">
      <button id="preview-roll">投骰预览</button>
      <button id="preview-hit">投出 11</button>
      <button id="preview-purify">投出 12</button>
      <button id="preview-miss">无掉落</button>
    </div>
    <p id="preview-result" style="text-align:center"></p>
    <div id="reveal-cards"></div>
    <div id="reveal-desc"></div>
    <div id="player-hand"></div>
  </div>
  <script>window.GameUI = function () {};</script>
  <script src="../../adventure/js/content/registry.js"></script>
  <script src="../../adventure/js/items/item_defs.js"></script>
  <script src="../../js/ui/card_style.js"></script>
  <script src="../../adventure/js/deck/adventure_deck.js"></script>
  <script src="../../adventure/js/engine/loot.js"></script>
  <script src="../../js/ui/events.js"></script>
  <script src="../../js/ui/feedback.js"></script>
  <script>
    const ui = new GameUI();
    const evt = { monsterName: 'FrozenMammoth', roll: 11, drops: ['SmallPotionTrophy'], rollIndex: 2, rollCount: 3 };
    const hand = document.getElementById('player-hand');
    for (let i = 1; i <= 4; i++) hand.appendChild(renderCard({ color: 'BLUE', value: i, isNumberCard: true }, 70, 100));
    ui._renderPlayerHand = () => {};
    ui.state = { phase: 'GAME_OVER' };
    const die = document.createElement('div');
    die.className = 'd12-die d12-die-landed d12-die-success';
    die.innerHTML = '<span class="d12-die-label">D12</span><strong class="d12-die-face">11</strong>';
    document.getElementById('reveal-cards').appendChild(die);
    document.getElementById('preview-roll').onclick = () => ui._showTrophySettlement(evt);
    const showResult = async (roll, drops, animate = true) => {
      die.querySelector('.d12-die-face').textContent = roll;
      ui._showTrophySettlement({ ...evt, roll, drops }, true);
      document.getElementById('preview-result').textContent = '等待玩家确认';
      if (animate && drops.length) await ui._playTrophyDropAnimation(drops);
      if (await ui._waitForTrophyConfirmation()) document.getElementById('preview-result').textContent = '已确认，可进入下一步结算';
    };
    document.getElementById('preview-hit').onclick = () => showResult(11, ['SmallPotionTrophy']);
    document.getElementById('preview-purify').onclick = () => showResult(12, ['PurifyWaterTrophy']);
    document.getElementById('preview-miss').onclick = () => showResult(10, []);
    showResult(11, ['SmallPotionTrophy'], false);
  </script>
</body>
</html>
