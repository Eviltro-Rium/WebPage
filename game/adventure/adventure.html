    <script>
        (function () {

            const container = document.getElementById('adventure-container');
            const ui = new AdventureUI(container);
            ui.bindActions();

            let currentChar = null;

            const menuToggle = document.getElementById('adv-menu-toggle');
            const skillBookBtn = document.getElementById('adv-skill-book');
            const homeBtn = document.getElementById('adv-home-btn');
            const menuBar = document.getElementById('adv-menu-bar');
            let logVisible = false;

            function setAdventureSelectChrome(isSelect) {
                if (homeBtn) homeBtn.hidden = !isSelect;
                if (menuBar) menuBar.hidden = !!isSelect;
            }
            setAdventureSelectChrome(true);

            function abandonAndLeave() {
                // “退出游戏” means abandoning the current run.  Clear both
                // the safe map save and any in-tab combat snapshot before
                // navigating, otherwise the next visit with the same
                // character restores the previous adventure progress.
                if (window.AdventureBattleController && typeof window.AdventureBattleController.abandonAdventure === 'function') {
                    window.AdventureBattleController.abandonAdventure();
                } else if (window.AdventureSave && typeof window.AdventureSave.clear === 'function') {
                    window.AdventureSave.clear();
                }
                window.location.href = '../index.html';
            }

            function toggleAdventureLog() {
                logVisible = !logVisible;
                ui.logVisible = logVisible;
                const logBox = document.getElementById('adventure-log-box');
                if (!logBox) return;
                if (logVisible) {
                    logBox.style.display = '';
                    const gc = document.getElementById('game-container');
                    if (gc && gc.style.display !== 'none') {
                        logBox.classList.add('adventure-log-float');
                        document.body.appendChild(logBox);
                    }
                } else {
                    logBox.style.display = 'none';
                    logBox.classList.remove('adventure-log-float');
                }
            }

            function openAdventureMenu() {
                if (!window.GameSideMenu) return;
                window.GameSideMenu.open({
                    panel: 'menu',
                    title: '⛭ 菜单',
                    items: [
                        { id: 'gm-log', className: 'game-menu-log', label: logVisible ? '📒 关闭日志' : '📒 打开日志', onClick: toggleAdventureLog },
                        { id: 'gm-quit', className: 'game-menu-quit', label: '🚪 退出游戏', onClick: abandonAndLeave },
                        { id: 'gm-cancel', className: 'game-menu-cancel', label: '✕ 继续游戏' }
                    ]
                });
            }

            window.AdventureMenuActions = {
                extraItems() {
                    return [{
                        id: 'gm-log',
                        className: 'game-menu-log',
                        label: logVisible ? '📒 关闭日志' : '📒 打开日志',
                        onClick: toggleAdventureLog
                    }];
                }
            };

            menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                openAdventureMenu();
            });
            if (skillBookBtn) {
                skillBookBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openAdventureSkills();
                });
            }

            function openAdventureSkills() {
                const playerName = (currentChar
                    || (ui.eng && ui.eng.s && ui.eng.s.player && ui.eng.s.player.name)
                    || '').replace(/^AI\d*\s+/, '');
                if (!playerName) {
                    const tip = document.createElement('div');
                    tip.className = 'adv-toast';
                    tip.textContent = '请先选择角色并开始冒险';
                    (document.getElementById('adventure-container') || document.body).appendChild(tip);
                    setTimeout(() => tip.remove(), 1500);
                    return;
                }

                const skillData = window.SKILL_DATA || (typeof SKILL_DATA !== 'undefined' ? SKILL_DATA : null);
                if (!skillData) return;

                const chars = [{ name: playerName, label: '玩家', color: '#3b82f6' }];

                const addOpponent = (rawName, label, color, stage) => {
                    const name = String(rawName || '').replace(/^AI\d*\s+/, '');
                    if (!name || chars.some(c => c.name === name)) return;
                    chars.push({ name, label, color, stage, isNpc: true });
                };
                const enemyStage = (ui.eng && ui.eng.s && ui.eng.s.stage) || 1;
                const controller = window.AdventureBattleController && window.AdventureBattleController.activeEngine
                    ? window.AdventureBattleController.activeEngine() : null;
                if (controller && controller.s) {
                    if (controller.s.ai && controller.s.ai.name) addOpponent(controller.s.ai.name, '敌人', '#ef4444', enemyStage);
                    if (controller.s.ai2 && controller.s.ai2.name) addOpponent(controller.s.ai2.name, '敌人2', '#a855f7', enemyStage);
                }
                if (ui.eng && ui.eng.s && ui.eng.s.combat) {
                    const combat = ui.eng.s.combat;
                    const combatName = value => typeof value === 'string' ? value : value && value.name;
                    addOpponent(combatName(combat.enemy), '敌人', '#ef4444', enemyStage);
                    addOpponent(combatName(combat.enemy2), '敌人2', '#a855f7', enemyStage);
                }

                // NPC：白1~6 + 白7（轮空）；白0仅 Boss。玩家角色仍显示完整 0~7。
                const PLAYER_SKILL_GRID = [
                    { atkKey: 0, defKey: 0, label: '1' }, { atkKey: 1, defKey: 1, label: '2' },
                    { atkKey: 2, defKey: 2, label: '3' }, { atkKey: 7, defKey: 3, label: '0' },
                    { atkKey: 3, defKey: -1, label: '4' }, { atkKey: 4, defKey: -1, label: '5' },
                    { atkKey: 5, defKey: -1, label: '6' }, { atkKey: 6, defKey: -1, label: '7' }
                ];
                const NPC_SKILL_GRID = [
                    // NPC attack arrays use 1/2/3/4/5/6/7/0 order while
                    // defense arrays only contain 1/2/3/0. Keep explicit
                    // indexes here; without them atk[undefined]/def[undefined]
                    // rendered every NPC skill as “—/无防御效果”.
                    { atkKey: 0, defKey: 0, label: '1' },
                    { atkKey: 1, defKey: 1, label: '2' },
                    { atkKey: 2, defKey: 2, label: '3' },
                    { atkKey: 7, defKey: 3, label: '0' },
                    { atkKey: 3, defKey: -1, label: '4' },
                    { atkKey: 4, defKey: -1, label: '5' },
                    { atkKey: 5, defKey: -1, label: '6' },
                    { atkKey: 6, defKey: -1, label: '7' }
                ];
                const stripPrefix = t => (t || '').replace(/^\d+\s*/, '');
                const tagifySkill = t => {
                    let out = String(t || '');
                    const names = ['失温', '炙热', '冰封', '定时炸弹', '沙盲', '荆棘', '催眠', '沉睡', '捆缚', '嗜血', '寄生', '茂盛', '潜水', '飞翔', '守护', '暴击', '致盲', '中毒', '流血', '冷冻', '灼伤'];
                    for (const name of names) {
                        out = out.replace(new RegExp('(?<!\\[)' + name + '(?!\\])', 'g'), '[' + name + ']');
                    }
                    return out;
                };
                const colorize = t => {
                    if (typeof parseSegments !== 'function') return t;
                    const segs = parseSegments(tagifySkill(t), '');
                    return typeof skillSegmentsToHtml === 'function'
                        ? skillSegmentsToHtml(segs)
                        : segs.map(sg => sg.color ? '<span style="color:' + sg.color + '">' + sg.text + '</span>' : sg.text).join('');
                };

                let html = '';

                for (const ch of chars) {
                    let atk = (skillData.attack && skillData.attack[ch.name]) || [];
                    let def = (skillData.defend && skillData.defend[ch.name]) || [];
                    if (ch.stage && ch.stage > 1 && skillData.castleStageMods) {
                        const modTable = skillData.castleStageMods[ch.name];
                        if (modTable && modTable[ch.stage]) {
                            if (modTable[ch.stage].attack) atk = modTable[ch.stage].attack;
                            if (modTable[ch.stage].defend) def = modTable[ch.stage].defend;
                        }
                    }
                    let dynAtk = null, dynDef = null;
                    if (ch.isNpc) {
                        const fn = window.AdventureMonsterBridge && window.AdventureMonsterBridge.getAdventureNpcSkillDesc;
                        if (fn) {
                            const mkCard = vv => ({ value: vv, isNumberCard: true, isItemCard: false, isBlack: false, isWhite: true });
                            const stage = ch.stage || 1;
                            for (const vv of [1, 2, 3, 4, 5, 6, 7, 0]) {
                                const aDesc = fn(ch.name, mkCard(vv), false, { stage });
                                const dDesc = fn(ch.name, mkCard(vv), true, { stage });
                                if (aDesc) { if (!dynAtk) dynAtk = {}; dynAtk[vv] = aDesc; }
                                if (dDesc) { if (!dynDef) dynDef = {}; dynDef[vv] = dDesc; }
                            }
                            if (dynAtk || dynDef) { atk = []; def = []; }
                        }
                    }
                    if (!atk.length && !def.length && !dynAtk && !dynDef) continue;
                    const labelExtra = (ch.stage && ch.stage > 1) ? (' (第' + ch.stage + '层)') : '';
                    html += '<div class="skill-overlay-char"><span class="skill-overlay-char-label" style="color:' + ch.color + '">' +
                        ch.label + '：' + ch.name + labelExtra + '</span></div>';
                    html += '<div class="skill-grid">';
                    const npcMod = ch.isNpc && window.AdventureRegistry
                        ? (window.AdventureRegistry.getMonster(ch.name) || window.AdventureRegistry.getBoss(ch.name))
                        : null;
                    const includeZero = !!(npcMod && npcMod.whiteZeros) || !!(dynAtk && dynAtk[0]) || !!(dynDef && dynDef[0]);
                    const canDefendHigh = !!(npcMod && npcMod.canDefendHigh);
                    const grid = ch.isNpc
                        ? NPC_SKILL_GRID.filter(row => row.label !== '0' || includeZero)
                        : PLAYER_SKILL_GRID;
                    for (const row of grid) {
                        const rv = parseInt(row.label, 10);
                        let atkDesc, defDesc;
                        const hasDefSlot = ch.isNpc
                            ? (['1', '2', '3', '0'].includes(row.label) || (canDefendHigh && ['4', '5', '6', '7'].includes(row.label)))
                            : (row.defKey >= 0);
                        if (dynAtk) atkDesc = dynAtk[rv] ? colorize(dynAtk[rv]) : '—';
                        else atkDesc = atk[row.atkKey] ? colorize(stripPrefix(atk[row.atkKey])) : '—';
                        if (dynDef) defDesc = hasDefSlot ? (dynDef[rv] ? colorize(dynDef[rv]) : '无防御效果') : '';
                        else defDesc = hasDefSlot && def[row.defKey] ? colorize(stripPrefix(def[row.defKey])) : (hasDefSlot ? '无防御效果' : '');
                        html += '<div class="skill-row"><div class="skill-cell skill-atk">' + atkDesc + '</div><div class="skill-num">' + row.label + '</div>';
                        html += hasDefSlot
                            ? '<div class="skill-cell skill-def">' + defDesc + '</div>'
                            : '<div class="skill-cell skill-def skill-no-def"></div>';
                        html += '</div>';
                    }
                    html += '</div>';
                }

                html += '<div class="skill-footnote">🗡️伤害 ❤️生命 🛡️格挡 🃏卡牌 · 小数均向上取整</div>';
                if (!window.GameSideMenu) return;
                window.GameSideMenu.open({
                    panel: 'skills',
                    title: '📖 角色技能',
                    boxClass: 'game-menu-box-book',
                    html: html
                });
            }

            const params = new URLSearchParams(window.location.search);
            const testMode = params.get('test') === '1';
            const savedAdventure = !testMode && window.AdventureSave ? window.AdventureSave.load() : null;
            const presetChar = params.get('char') || (savedAdventure && savedAdventure.characterName);

            const pickStartMap = () => AdventureUI.selectStageMap(1).mapUrl;

            if (presetChar) {
                currentChar = presetChar;
                setAdventureSelectChrome(false);
                const bg = document.getElementById('castle-bg'); if (bg) bg.style.display = 'block';
                if (testMode) ui.startTest(presetChar);
                else ui.restoreOrStart(pickStartMap, presetChar);
                return;
            }

            const screen = document.createElement('div');
            screen.className = 'adv-select-screen';
            screen.innerHTML =
                '<h2>地牢冒险 · 选择主角</h2>' +
                '<div class="adv-char-grid" id="adv-char-grid"></div>' +
                '<button class="adv-start-btn" id="adv-start" disabled>进入地牢</button>';
            container.appendChild(screen);

            const grid = screen.querySelector('#adv-char-grid');
            const startBtn = screen.querySelector('#adv-start');
            let picked = null;

            const charAvatar = { Ryan: '../avatars/Ryan.webp', Leon: '../avatars/Leon.webp', Chan: '../avatars/Chan.webp', Saiki: '../avatars/Saiki.webp', Blaze: '../avatars/Blaze.webp', Serenity: '../avatars/Serenity.webp', Moze: '../avatars/Moze.webp', Knight: '../avatars/Knight.webp', Otto: '../avatars/Otto.webp' };

            CharacterRegistry.all().filter(mod => {
                if (mod.adventureNpc) return false;
                return !(window.AdventureRegistry && mod.name &&
                    (window.AdventureRegistry.getMonster(mod.name) || window.AdventureRegistry.getBoss(mod.name)));
            }).forEach(mod => {
                const btn = document.createElement('button');
                btn.className = 'adv-char-pick';
                const avatar = charAvatar[mod.name];
                if (avatar) {
                    btn.innerHTML = '<img class="adv-char-avatar" src="' + avatar + '" alt="' + mod.name + '"><div class="adv-char-pick-name">' + mod.name + '</div><div class="adv-char-pick-type">' + mod.type + '</div>';
                } else {
                    btn.innerHTML = '<div class="adv-char-pick-name">' + mod.name + '</div><div class="adv-char-pick-type">' + mod.type + '</div>';
                }
                btn.addEventListener('click', () => {
                    grid.querySelectorAll('.adv-char-pick').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    picked = mod.name;
                    startBtn.disabled = false;
                });
                grid.appendChild(btn);
            });

            startBtn.addEventListener('click', () => {
                if (!picked) return;
                currentChar = picked;
                setAdventureSelectChrome(false);
                container.innerHTML = '';
                const bg = document.getElementById('castle-bg'); if (bg) bg.style.display = 'block';
                ui.restoreOrStart(pickStartMap, picked);
            });
        })();
    </script>
    <script src="../js/version.js?v=3.3"></script>
</body>
</html>
