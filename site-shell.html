    <script>
      (function () {
        var root = document.documentElement;
        root.classList.add("home-scene-loading");
        var sceneFinished = false;
        var fallbackTimer;
        function finishScene(ready) {
          if (sceneFinished) return;
          sceneFinished = true;
          window.clearTimeout(fallbackTimer);
          root.classList.remove("home-scene-loading");
          root.classList.add("home-scene-finishing");
          if (ready) root.classList.add("home-scene-ready");
          var status = document.getElementById("home-scene-status");
          if (status) status.setAttribute("aria-hidden", "true");
          window.setTimeout(function () {
            root.classList.remove("home-scene-finishing");
            if (status) status.remove();
          }, 650);
        }
        document.addEventListener("rium-scene-ready", function () {
          // 即使超时后背景才就绪，也要允许完成首帧的画布淡入。
          root.classList.add("home-scene-ready");
          finishScene(true);
        }, { once: true });
        fallbackTimer = window.setTimeout(function () { finishScene(false); }, 8000);
        var theme = "light";
        try {
          theme = window.localStorage.getItem("rium-theme") === "dark" ? "dark" : "light";
        } catch (e) { /* ignore storage failures */ }
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
      })();
    </script>
<link rel="stylesheet" href="styles.css?v=20261028-playful-font">
<link rel="stylesheet" href="css/home.css?v=20261103-theme-fade">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden}
#site-content{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:1;background:transparent;transition:opacity .14s ease,transform .14s ease}
#site-content.is-leaving{opacity:0;transform:translateY(-6px)}
#site-content.is-loading{pointer-events:none}
#site-content.is-entering{animation:site-view-enter .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes site-view-enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#site-content{transition:none}#site-content.is-entering{animation:none}}
</style>
</head>
